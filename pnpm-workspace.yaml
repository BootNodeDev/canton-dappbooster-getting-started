# pnpm 10+ refuses to run a dependency's build script until it is listed here. protobufjs, under
# the Canton SDK, has one; the other four come with the local network's packages.
allowBuilds:
  protobufjs: true
  better-sqlite3: true
  cbor-extract: true
  esbuild: true
  secp256k1: true
minimumReleaseAgeExclude:
  - '@bootnodedev/canton-connect@0.6.0'
  - '@bootnodedev/canton-dappbooster@0.6.0'
  - '@bootnodedev/canton-theme@0.6.0'
